services:
  hermes-telegram-downloader:
    image: ${DOCKERHUB_USERNAME:-izumiko}/hermes-telegram-downloader:latest
    build: .
    container_name: hermes-telegram-downloader
    network_mode: bridge
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
    volumes:
      # 配置文件
      - "./config.yaml:/app/config.yaml"
      - "./data.yaml:/app/data.yaml"
      - "./bot.yaml:/app/bot.yaml"
      # 下载目录 (修改为你的实际路径)
      - "./downloads:/app/downloads/"
      # 日志
      - "./log:/app/log/"
      # Telegram session
      - "./sessions:/app/sessions"
      # 临时文件
      - "./temp:/app/temp"
    restart: unless-stopped
