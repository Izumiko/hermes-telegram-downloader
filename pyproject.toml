[project]
name = "hermes-telegram-downloader"
version = "3.0.4"
description = "Telegram 媒体下载 / 转发 / 监听工具，带任务持久化 + 崩溃恢复 + 现代 WebUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "rich>=13.0",
    "loguru>=0.7",
    "flask>=3.0",
    "ply>=3.11",
    "ruamel.yaml>=0.18",
    "telethon>=1.38",
    "python-socks[asyncio]>=2.0",
]

[project.optional-dependencies]
fast = ["cryptg>=0.4"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.0",
    "basedpyright>=1.40.1",
]

[project.scripts]
media-downloader = "hermes_telegram_downloader.media_downloader:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_telegram_downloader"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
